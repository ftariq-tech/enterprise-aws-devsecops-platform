name: DevSecOps CI - tests, security and Terraform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests -v
      - name: Static Python security check
        run: bandit -r app -ll

  terraform-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Terraform format normalization (no cloud credentials)
        run: terraform fmt -recursive
      - name: Terraform init - no remote state
        run: terraform init -backend=false -input=false
      - name: Terraform validate - no deployment
        run: terraform validate -no-color

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (not pushed)
        run: docker build -t orders-demo:ci .
